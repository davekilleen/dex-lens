name: Release Dex Lens

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version already declared in pyproject.toml
        required: true
        type: string
      prerelease:
        description: >-
          Publish as a prerelease so it does NOT become "latest". The public
          one-line install keeps serving the current stable release; testers
          install this build from its explicit versioned URL. Flip the release
          off prerelease later to promote it to latest.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dex-lens-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign exact release
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install exact release tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Bind the release to this exact commit and version
        id: identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$VERSION" = "$PROJECT_VERSION"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'source_commit=%s\n' "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run release contract checks
        run: |
          python -m pytest -rs tests/release tests/test_packaging.py tests/concierge
          ruff check scripts/release_bundle.py scripts/render_release_installer.py scripts/smoke_release_installer.py tests/release
          python scripts/check_inventory.py

      - name: Build the unsigned complete candidate
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          python scripts/release_bundle.py build --version "$VERSION" --output release-candidate

      - name: Require the dedicated release-signing key
        env:
          DEX_LENS_RELEASE_SIGNING_KEY_PEM: ${{ secrets.DEX_LENS_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$DEX_LENS_RELEASE_SIGNING_KEY_PEM" ]; then
            printf '%s\n' "Dedicated Dex Lens release signing key is not configured" >&2
            exit 1
          fi

      - name: Sign the exact manifest
        env:
          DEX_LENS_RELEASE_SIGNING_KEY_PEM: ${{ secrets.DEX_LENS_RELEASE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          PRIVATE_KEY="$RUNNER_TEMP/release-private.pem"
          trap 'rm -f "$PRIVATE_KEY"' EXIT
          printf '%s' "$DEX_LENS_RELEASE_SIGNING_KEY_PEM" > "$PRIVATE_KEY"
          python scripts/release_bundle.py sign \
            --manifest release-candidate/release-manifest.json \
            --private-key "$PRIVATE_KEY" \
            --signature release-candidate/release-manifest.sig \
            --public-key release-candidate/release-public-key.pem
          rm -f "$PRIVATE_KEY"
          test ! -e "$PRIVATE_KEY"

      - name: Render and syntax-check the public installer
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/render_release_installer.py \
            --manifest release-candidate/release-manifest.json \
            --release-url "https://github.com/davekilleen/dex-lens/releases/download/v$VERSION" \
            --public-key release-candidate/release-public-key.pem \
            --output release-candidate/install.sh
          bash -n release-candidate/install.sh

      - name: Upload the complete candidate for consumer proofs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dex-lens-release-candidate
          path: release-candidate/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke:
    name: Install proof (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dex-lens-release-candidate
          path: release-candidate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Exercise the real installer and resulting command
        env:
          DEX_LENS_INSTALL_ONLY: "1"
        run: |
          python scripts/smoke_release_installer.py \
            --artifacts release-candidate \
            --installer release-candidate/install.sh

  publish:
    name: Publish complete GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      DEX_LENS_PRERELEASE: ${{ inputs.prerelease && '1' || '' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dex-lens-release-candidate
          path: release-candidate

      - name: Prove the complete asset set before publication
        run: |
          set -euo pipefail
          test -f release-candidate/release-manifest.json
          test -f release-candidate/release-manifest.sig
          test -f release-candidate/release-public-key.pem
          test -f release-candidate/install.sh
          test -f "release-candidate/dex-lens-v${VERSION}-linux-x86_64.tar.gz"
          test -f "release-candidate/dex-lens-v${VERSION}-macos-arm64.tar.gz"
          test "$(find release-candidate -maxdepth 1 -type f | wc -l | tr -d ' ')" = "6"

      - name: Publish atomically after both consumer proofs pass
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "Release v$VERSION already exists; refusing to replace it" >&2
            exit 1
          fi
          gh release create "v$VERSION" release-candidate/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "Dex Lens v$VERSION" \
            --notes "Signed self-serve Dex Lens release for Apple Silicon Mac and Linux x86_64. See the repository README for the current release details." \
            ${DEX_LENS_PRERELEASE:+--prerelease} \
            --draft
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
