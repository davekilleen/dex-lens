name: CI

# The repo is public, so Actions minutes are unmetered and the full matrix
# runs on every push and pull request. (While it was private, macos-14's
# 10x billing multiplier consumed ~85% of a month's allowance in hours —
# if it ever goes private again, split the macOS legs out behind a label.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: M3 doorway + clean-wheel evidence
        # Covers the shipped console entry point, loopback doorway lifecycle,
        # and a non-editable install of the real wheel artifact.
        run: python -m pytest -rs tests/concierge tests/test_packaging.py

      - name: Test (pytest)
        # -rs so a hostile fixture that skipped (e.g. bind-mount-escape where
        # user namespaces are unavailable) is visible in the log rather than
        # silently absent from a green run.
        run: python -m pytest -rs

      - name: adapter-conformance-claude-code (Linux containment gate)
        if: matrix.os == 'ubuntu-latest'
        # HANDOFF 5.4: the runnable Host Adapter conformance suite, run
        # against the claude_code deep adapter under Linux's real
        # OS-enforced containment (seccomp).
        # --require-os-enforcement makes an honest refusal exit non-zero:
        # "the adapter declined to run" is correct product behaviour but is
        # not a passing Linux proof gate.
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --require-os-enforcement

      - name: adapter-conformance-claude-code (macOS honest fallback)
        if: matrix.os == 'macos-14'
        # Seatbelt's current runner proof is connect-time only.  The adapter
        # therefore refuses deep inspection and keeps the guided path; this
        # leg verifies that refusal remains conformant without pretending it
        # is OS-enforced evidence.
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --no-require-os-enforcement

      - name: g2-inventory-check
        # G2 field-level data boundary: schema-validates data_inventory.yaml,
        # fails the build on any persisted/transmitted field without an
        # inventory entry, on inventory drift, on any pydantic model outside
        # the typed serialization boundary, and on any stored field without a
        # registered deletion path.
        run: python scripts/check_inventory.py

  m3-egress-gate:
    name: M3 packet + DNS + proxy egress gate (Linux)
    # The evidence leg is isolated to a disposable Docker network namespace.
    # The container has no network interfaces except loopback.  Every default
    # capability is dropped before only NET_ADMIN (bring loopback up) and
    # NET_RAW (AF_PACKET/tcpdump) are added.  No host sudo or SYS_ADMIN is used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated evidence image
        run: docker build -f scripts/Dockerfile.m3-egress -t dex-lens-m3-egress .

      - name: M3 full journey OS egress evidence
        run: |
          install -d -m 0777 m3-egress-artifact
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            --security-opt no-new-privileges=true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            -e M3_EGRESS_NETWORK_ISOLATED=1 \
            -e M3_EGRESS_ARTIFACT_DIR=/evidence \
            -v "${PWD}/m3-egress-artifact:/evidence" \
            dex-lens-m3-egress

      - name: Upload M3 egress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-egress-evidence
          path: m3-egress-artifact/
          if-no-files-found: error

  g1-bind-mount-gate:
    name: G1 privileged bind-mount containment proof (Linux)
    # The normal matrix must keep skipping loudly when user namespaces are
    # unavailable. This disposable image is the exact narrow-privilege proof
    # leg: only SYS_ADMIN is added, and the gate rejects any skip/unproven
    # warning or incomplete child report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build disposable bind-mount gate image
        run: docker build -f scripts/Dockerfile.g1-bind-mount -t dex-lens-g1-bind-mount .

      - name: Run privileged bind-mount hostile fixture
        run: |
          install -d -m 0777 g1-bind-mount-artifact
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt no-new-privileges=true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            -e G1_BIND_MOUNT_EVIDENCE_DIR=/evidence \
            -v "${PWD}/g1-bind-mount-artifact:/evidence" \
            dex-lens-g1-bind-mount

      - name: Upload G1 bind-mount evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-bind-mount-evidence
          path: g1-bind-mount-artifact/
          if-no-files-found: error
