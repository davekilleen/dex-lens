name: CI

# Runner budget (this is a PRIVATE repo, so Actions minutes are metered
# against the account's monthly allowance; public repos are unlimited and
# free). macos-14 bills at a 10x minute multiplier, so a two-leg macOS
# matrix on every push consumed ~85% of a month's allowance in a couple of
# hours on 2026-08-07 and stopped CI outright.
#
# The split below: Linux (1x) proves what it can on every push and pull
# request; macOS runs only where its result changes a decision — on main,
# and on demand via workflow_dispatch or the `macos` label on a PR.
#
# What this trades away, stated honestly: macOS is the pilot's target
# platform, and its sandbox-exec containment layer is exercised only on the
# macOS legs. A PR touching containment, the .sb profile, or the adapter
# MUST be run with macOS before merge — label it `macos` or dispatch it.
# Linux going green is not evidence about darwin.
#
# Revisit if the repo goes public (D1): public repos get unlimited free
# Actions, and the full matrix can come back on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include-macos:
        description: "Run the macOS legs too"
        type: boolean
        default: true

jobs:
  linux:
    name: ruff + pytest (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        # -rs so a hostile fixture that skipped (e.g. bind-mount-escape where
        # user namespaces are unavailable) is visible in the log rather than
        # silently absent from a green run.
        run: python -m pytest -rs

      - name: adapter-conformance-claude-code
        # HANDOFF 5.4: the runnable Host Adapter conformance suite, run
        # against the claude_code deep adapter under the host's real
        # OS-enforced containment (seccomp on Linux, sandbox-exec on macOS).
        # --require-os-enforcement makes an honest refusal exit non-zero:
        # "the adapter declined to run" is correct product behaviour but is
        # not a passing gate.
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --require-os-enforcement

      - name: g2-inventory-check
        # G2 field-level data boundary: schema-validates data_inventory.yaml,
        # fails the build on any persisted/transmitted field without an
        # inventory entry, on inventory drift, on any pydantic model outside
        # the typed serialization boundary, and on any stored field without a
        # registered deletion path.
        run: python scripts/check_inventory.py

  macos:
    name: ruff + pytest (macos-14, py${{ matrix.python-version }})
    # Billed at 10x. Runs on main, on manual dispatch, and on any PR carrying
    # the `macos` label — so a containment change can still be proven on
    # darwin before it merges, without paying for it on every unrelated push.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.include-macos)
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'macos'))
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -rs

      - name: adapter-conformance-claude-code
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --require-os-enforcement

      - name: g2-inventory-check
        run: python scripts/check_inventory.py
