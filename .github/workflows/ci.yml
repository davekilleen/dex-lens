name: CI

# The repo is public, so Actions minutes are unmetered and the full matrix
# runs on every push and pull request. (While it was private, macos-14's
# 10x billing multiplier consumed ~85% of a month's allowance in hours —
# if it ever goes private again, split the macOS legs out behind a label.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_core_release:
        description: Exact Dex Core release to certify, including the v prefix
        required: true
        type: string
      expected_key_id:
        description: Exact pinned catalogue signing key id
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the exact public catalogue release bytes
        required: true
        type: string
      expected_catalog_version:
        description: Exact monotonic catalogue version
        required: true
        type: string
      expected_capability_count:
        description: Exact number of catalogue capabilities
        required: true
        type: string
      expected_job_count:
        description: Exact number of catalogue jobs
        required: true
        type: string
      expected_capability_ids:
        description: Complete comma-separated capability ids in release order
        required: true
        type: string

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: M3 doorway + clean-wheel evidence
        # Covers the shipped console entry point, loopback doorway lifecycle,
        # and a non-editable install of the real wheel artifact.
        run: python -m pytest -rs tests/concierge tests/test_packaging.py

      - name: M5 exact contribution egress
        # Stage 9 may send one value only: bytes freshly authorized from the
        # exact approved DisclosureManifest. Identity remains outside stages 1-8.
        run: python -m pytest -rs tests/concierge/test_contribution_journey.py tests/egress/test_m5_contribution_egress.py

      - name: Test (pytest)
        # -rs so a hostile fixture that skipped (e.g. bind-mount-escape where
        # user namespaces are unavailable) is visible in the log rather than
        # silently absent from a green run.
        run: python -m pytest -rs

      - name: adapter-conformance-claude-code (Linux containment gate)
        if: matrix.os == 'ubuntu-latest'
        # HANDOFF 5.4: the runnable Host Adapter conformance suite, run
        # against the claude_code deep adapter under Linux's real
        # OS-enforced containment (seccomp).
        # --require-os-enforcement makes an honest refusal exit non-zero:
        # "the adapter declined to run" is correct product behaviour but is
        # not a passing Linux proof gate.
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --require-os-enforcement

      - name: adapter-conformance-claude-code (macOS honest fallback)
        if: matrix.os == 'macos-14'
        # Seatbelt's current runner proof is connect-time only.  The adapter
        # therefore refuses deep inspection and keeps the guided path; this
        # leg verifies that refusal remains conformant without pretending it
        # is OS-enforced evidence.
        run: python -m capability_exchange.conformance --adapter claude-code-local --self-check --no-require-os-enforcement

      - name: g2-inventory-check
        # G2 field-level data boundary: schema-validates data_inventory.yaml,
        # fails the build on any persisted/transmitted field without an
        # inventory entry, on inventory drift, on any pydantic model outside
        # the typed serialization boundary, and on any stored field without a
        # registered deletion path.
        run: python scripts/check_inventory.py

  m3-egress-gate:
    name: M3 packet + DNS + proxy egress gate (Linux)
    # The evidence leg is isolated to a disposable Docker network namespace.
    # The container has no network interfaces except loopback.  Every default
    # capability is dropped before only NET_ADMIN (bring loopback up) and
    # NET_RAW (AF_PACKET/tcpdump) are added.  No host sudo or SYS_ADMIN is used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated evidence image
        run: docker build -f scripts/Dockerfile.m3-egress -t dex-lens-m3-egress .

      - name: M3 full journey OS egress evidence
        run: |
          install -d -m 0777 m3-egress-artifact
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --cap-add=NET_ADMIN \
            --cap-add=NET_RAW \
            --security-opt no-new-privileges=true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            -e M3_EGRESS_NETWORK_ISOLATED=1 \
            -e M3_EGRESS_ARTIFACT_DIR=/evidence \
            -e DEX_LENS_BUILD_COMMIT="${GITHUB_SHA}" \
            -v "${PWD}/m3-egress-artifact:/evidence" \
            dex-lens-m3-egress

      - name: Upload M3 egress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-egress-evidence
          path: m3-egress-artifact/
          if-no-files-found: error

  section6-live-bridge-proof:
    name: Section-6 live bridge proof (Linux)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    env:
      DEX_LENS_EXPECTED_CORE_RELEASE: ${{ inputs.expected_core_release || 'v1.95.2' }}
      DEX_LENS_EXPECTED_KEY_ID: ${{ inputs.expected_key_id || 'dex-core-lens-1' }}
      DEX_LENS_EXPECTED_SHA256: ${{ inputs.expected_sha256 || '79f3c2271f315493fb1f13b11e809e7899562c8a9aebb71cb9ff78d1b7cd89c6' }}
      DEX_LENS_EXPECTED_CATALOG_VERSION: ${{ inputs.expected_catalog_version || '1' }}
      DEX_LENS_EXPECTED_CAPABILITY_COUNT: ${{ inputs.expected_capability_count || '25' }}
      DEX_LENS_EXPECTED_JOB_COUNT: ${{ inputs.expected_job_count || '9' }}
      DEX_LENS_EXPECTED_CAPABILITY_IDS: ${{ inputs.expected_capability_ids || 'daily-plan,week-plan,process-meetings,dex-doctor,relationship-radar,save-insight,daily-review,week-review,meeting-prep,meeting-closeout,commitments,delegate-check,triage,project-health,decision-log,initiative-kickoff,product-brief,industry-truths,identity-snapshot,weekly-reflection,enable-semantic-search,xray,backup-setup,backup-now,backup-restore' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the live bridge proof path changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            > "$RUNNER_TEMP/section6-live-changed-files.txt"
          if grep -E '^(\.github/workflows/ci\.yml|scripts/section6_live_bridge_proof\.py|docs/pilot/bridge-evidence\.md|tests/e2e/test_bridge_golden_path\.py|src/capability_exchange/(catalogue|concierge)/)' \
            "$RUNNER_TEMP/section6-live-changed-files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No live bridge proof-path changes; proof skipped."
          fi

      - name: Build live bridge evidence image
        if: steps.changes.outputs.changed == 'true'
        run: docker build -f scripts/Dockerfile.m3-egress -t dex-lens-section6-live .

      - name: Execute section-6 live bridge proof
        if: steps.changes.outputs.changed == 'true'
        run: |
          install -d -m 0777 section6-live-evidence
          docker run --rm \
            --cap-drop=ALL \
            --cap-add=NET_RAW \
            --security-opt no-new-privileges=true \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            -e DEX_LENS_SECTION6_LIVE=1 \
            -e DEX_LENS_BUILD_COMMIT="${GITHUB_SHA}" \
            -v "${PWD}/section6-live-evidence:/evidence" \
            --entrypoint python \
            dex-lens-section6-live \
            scripts/section6_live_bridge_proof.py \
            --artifact-dir /evidence \
            --expected-core-release "${DEX_LENS_EXPECTED_CORE_RELEASE}" \
            --expected-key-id "${DEX_LENS_EXPECTED_KEY_ID}" \
            --expected-sha256 "${DEX_LENS_EXPECTED_SHA256}" \
            --expected-catalog-version "${DEX_LENS_EXPECTED_CATALOG_VERSION}" \
            --expected-capability-count "${DEX_LENS_EXPECTED_CAPABILITY_COUNT}" \
            --expected-job-count "${DEX_LENS_EXPECTED_JOB_COUNT}" \
            --expected-capability-ids "${DEX_LENS_EXPECTED_CAPABILITY_IDS}"

      - name: Upload section-6 live bridge evidence
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: section6-live-bridge-evidence
          path: section6-live-evidence/
          if-no-files-found: error

  g1-bind-mount-gate:
    name: G1 privileged bind-mount containment proof (Linux)
    # The normal matrix must keep skipping loudly when user namespaces are
    # unavailable. This disposable image is the exact narrow-privilege proof
    # leg: only SYS_ADMIN is added, and the gate rejects any skip/unproven
    # warning or incomplete child report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build disposable bind-mount gate image
        run: docker build -f scripts/Dockerfile.g1-bind-mount -t dex-lens-g1-bind-mount .

      - name: Run privileged bind-mount hostile fixture
        run: |
          install -d -m 0777 g1-bind-mount-artifact
          # GitHub's Docker AppArmor profile denies mount(2) even when the
          # container has SYS_ADMIN. This disposable, networkless fixture
          # must create the hostile mount before it can prove Lens refuses it.
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt no-new-privileges=true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            -e G1_BIND_MOUNT_EVIDENCE_DIR=/evidence \
            -e DEX_LENS_BUILD_COMMIT="${GITHUB_SHA}" \
            -v "${PWD}/g1-bind-mount-artifact:/evidence" \
            dex-lens-g1-bind-mount

      - name: Upload G1 bind-mount evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-bind-mount-evidence
          path: g1-bind-mount-artifact/
          if-no-files-found: error

  m5-egress-gate:
    name: M5 exact contribution-byte egress evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact M5 build
        run: python -m pip install -e ".[dev]"

      - name: Execute M5 exact-byte egress gate
        env:
          DEX_LENS_BUILD_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/m5_egress_gate.py
          --output /tmp/m5-egress-evidence/evidence.json

      - name: Upload M5 egress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-egress-evidence
          path: /tmp/m5-egress-evidence/
          if-no-files-found: error

  pilot-build-gate:
    name: Exact pilot-build release gate (G1-G6 + R3)
    needs: [test, m3-egress-gate, g1-bind-mount-gate, m5-egress-gate]
    if: >-
      ${{ always() && needs.test.result == 'success' &&
          needs.g1-bind-mount-gate.result == 'success' &&
          needs.m3-egress-gate.result == 'success' &&
          needs.m5-egress-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact pilot build
        run: python -m pip install -e ".[dev]"

      - name: Download G1 bind-mount evidence
        uses: actions/download-artifact@v4
        with:
          name: g1-bind-mount-evidence
          path: /tmp/g1-bind-mount-evidence

      - name: Download M3-M4 egress evidence
        uses: actions/download-artifact@v4
        with:
          name: m3-egress-evidence
          path: /tmp/m3-m4-egress-evidence

      - name: Download M5 contribution evidence
        uses: actions/download-artifact@v4
        with:
          name: m5-egress-evidence
          path: /tmp/m5-egress-evidence

      - name: Execute all six gates and R3 on this commit
        run: |
          mkdir -p pilot-gate-artifact
          python scripts/pilot_gate.py \
            --commit "${GITHUB_SHA}" \
            --formal-evidence /tmp/g1-bind-mount-evidence/g1-bind-mount-gate.json \
            --formal-evidence /tmp/m3-m4-egress-evidence/evidence.json \
            --formal-evidence /tmp/m5-egress-evidence/evidence.json \
            --output pilot-gate-artifact/pilot-build-gate.json

      - name: Upload exact pilot-build gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-build-gate-${{ github.sha }}
          path: pilot-gate-artifact/
          if-no-files-found: error
