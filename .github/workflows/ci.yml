name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest

      - name: adapter-conformance-claude-code
        # HANDOFF 5.4: the runnable Host Adapter conformance suite, run
        # against the claude_code deep adapter under the host's real
        # OS-enforced containment (seccomp on Linux, sandbox-exec on macOS).
        # Exit 1 on any failed check.
        #
        # --require-os-enforcement (exit 3) is what makes this a gate rather
        # than a formality. Without it the step goes green on a host where
        # containment could not be established, because an honest refusal is
        # not a failed check — so a regression that broke the macOS sandbox,
        # or a packaging change that dropped the .sb profile from the wheel,
        # would ship silently green. Passed explicitly as well as being the
        # default under CI, so the gate never rests on that inference.
        run: >-
          python -m capability_exchange.conformance
          --adapter claude-code-local --self-check --require-os-enforcement

      - name: g2-inventory-check
        # G2 field-level data boundary: schema-validates data_inventory.yaml,
        # fails the build on any persisted/transmitted field without an
        # inventory entry, on inventory drift, on any pydantic model outside
        # the typed serialization boundary, and on any stored field without a
        # registered deletion path.
        run: python scripts/check_inventory.py
