name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ruff + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest

      - name: g2-inventory-check
        # G2 field-level data boundary: schema-validates data_inventory.yaml,
        # fails the build on any persisted/transmitted field without an
        # inventory entry, on inventory drift, on any pydantic model outside
        # the typed serialization boundary, and on any stored field without a
        # registered deletion path.
        run: python scripts/check_inventory.py
