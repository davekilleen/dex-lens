    collection: "selected locally by the person from operations proven for the host"
    derivation: "validated through the closed OperationKind vocabulary"
    display: "shown on the exact adaptation preview"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "ephemeral until a separately inventoried local approval record exists"

  OperationRequest.approved_root:
