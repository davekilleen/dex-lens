# Dex Capability Exchange — G2 machine-readable data inventory.
#
# Every field the product persists or transmits has an entry here declaring
# collection, derivation, display, storage, sharing, deletion, and audit.
# A field without an entry is private: non-persistable and non-transmittable
# by construction (the typed serialization boundary refuses it).
#
# Format: a strict YAML subset parsed by capability_exchange.boundary.inventory
# (2-space indentation, "key: value" scalars, nested mappings, double-quoted
# or bare strings, comments). Schema-validated by pydantic at import and by
# scripts/check_inventory.py in CI (the g2-inventory-check step).
#
# M1 posture: diagnosis is ephemeral and telemetry-free. The only stored
# artifact on this slice is the local crash log, which records structure
# (exception type, code locations) and never values. No field declares any
# sharing; the schema itself only admits "sharing: never" at M1 — widening
# it is a G2 schema change that reopens gate review (see HANDOFF D8 for the
# catalog-refresh decision that would introduce the first approved flow).

inventory_version: 1

fields:

  MutationContract.contract_id:
    description: "stable kebab-case identity of one host mutation contract"
    collection: "authored with the host-specific adaptation implementation"
    derivation: "none; validated as kebab-case"
    display: "shown before adaptation so the person can identify the contract in force"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "static product declaration; carries no personal data"

  MutationContract.contract_version:
    description: "semver version of the host mutation contract"
    collection: "authored with the host-specific adaptation implementation"
    derivation: "none; validated as MAJOR.MINOR.PATCH"
    display: "shown in the preview and local receipt provenance"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "static product declaration; carries no personal data"

  MutationContract.operations:
    description: "closed allowlisted operation ids this contract may construct"
    collection: "authored from the M4 data-driven local-operation registry"
    derivation: "validated as unique members of the closed OperationKind vocabulary"
    display: "used to show which bounded changes the host can offer"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "static product declaration; blocked operation categories have no member"

  MutationContract.guarantees:
    description: "complete closed set of guarantees required before an operation is offered"
    collection: "authored with the contract and validated against the M4 required set"
    derivation: "missing or duplicate guarantees reject the contract"
    display: "summarized in the adaptation preview and capability status"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "static declaration whose claims are independently checked by T1-T9 conformance"

  OperationRequest.operation:
