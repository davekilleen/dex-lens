    derivation: "validated as bounded absolute path with no glob syntax"
    display: "shown verbatim on the exact adaptation preview"
    storage: none
    sharing: never
    deletion: not-stored
    audit: "ephemeral private path; never transmitted"

  OperationRequest.relative_path:
